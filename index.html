<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTI로 포켓몬 찾기</title>

<style>
  body {
    background: #fff8e8;
    color: #57452f;
    font-family: sans-serif;
    text-align: center;
    padding: 25px 12px;
  }

  h1 { color: #d69d20; }

  .card {
    max-width: 500px;
    margin: auto;
    padding: 25px 15px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 20px #eadfca;
  }

  #buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    padding: 14px 3px;
    border: none;
    border-radius: 12px;
    background: #ffe6a0;
    color: #57452f;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover { background: #ffcf57; }

  #result { display: none; }

  #emoji {
    font-size: 85px;
    margin: 20px;
  }

  #reason, #matchReason {
    line-height: 1.8;
  }

  .back {
    width: 100%;
    margin-top: 20px;
    background: #ffcf57;
  }
</style>
</head>

<body>
  <h1>✨ MBTI 포켓몬 찾기</h1>
  <p>나와 닮은 포켓몬은 누구일까?</p>

  <div class="card">
    <div id="menu">
      <h2>💛 내 MBTI를 선택해 줘!</h2>
      <div id="buttons"></div>
    </div>

    <div id="result">
      <p id="type"></p>
      <div id="emoji"></div>
      <h2 id="name"></h2>
      <p id="reason"></p>
      <hr>
      <h3>💕 찰떡궁합 MBTI</h3>
      <h2 id="match"></h2>
      <p id="matchReason"></p>
      <button class="back" onclick="back()">다시 고르기 ↩</button>
    </div>
  </div>

<script>
const data = {
  ISTJ: ["잠만보","😴","차분하고 책임감이 강해요. 자기만의 리듬을 지키며 맡은 일을 해내요.","ESFP"],
  ISFJ: ["이브이","🦊","다정하고 배려심이 많아요. 소중한 사람을 따뜻하게 챙겨요.","ESFP"],
  INFJ: ["가디안","🧚","다른 사람의 마음을 잘 이해해요. 자신만의 가치관도 소중히 여겨요.","ENFP"],
  INTJ: ["뮤츠","🔮","분석적이고 독립적이에요. 목표를 세우고 전략적으로 나아가요.","ENFP"],
  ISTP: ["루카리오","🐺","침착하고 실용적이에요. 문제가 생기면 직접 해결해요.","ESFJ"],
  ISFP: ["푸린","🎤","감수성이 풍부하고 부드러워요. 자신만의 취향을 소중히 여겨요.","ENFJ"],
  INFP: ["메타몽","💜","상상력이 풍부하고 자유로워요. 자신만의 특별한 세계가 있어요.","ENFJ"],
  INTP: ["후딘","🥄","호기심이 많고 분석적이에요. 궁금한 것은 깊이 탐구해요.","ENTJ"],
  ESTP: ["리자몽","🐉","활동적이고 도전적이에요. 새로운 경험을 즐겨요.","ISFJ"],
  ESFP: ["피카츄","⚡","밝고 에너지가 넘쳐요. 주변 사람들에게 즐거움을 줘요.","ISTJ"],
  ENFP: ["토게피","🐣","긍정적이고 아이디어가 많아요. 새로운 가능성을 발견해요.","INFJ"],
  ENTP: ["팬텀","👻","재치 있고 창의적이에요. 남다른 생각과 새로운 도전을 좋아해요.","INFJ"],
  ESTJ: ["거북왕","🐢","책임감 있고 체계적이에요. 목표를 향해 꾸준히 나아가요.","ISFP"],
  ESFJ: ["마릴","🩵","친절하고 사교적이에요. 주변 사람들이 행복하도록 노력해요.","ISTP"],
  ENFJ: ["루카리오","💙","리더십이 있고 따뜻해요. 다른 사람의 성장을 응원해요.","INFP"],
  ENTJ: ["망나뇽","🐲","결단력과 추진력이 뛰어나요. 큰 목표를 향해 도전해요.","INTP"]
};

const types = Object.keys(data);
const buttons = document.getElementById("buttons");

types.forEach(type => {
  const btn = document.createElement("button");
  btn.textContent = type;
  btn.onclick = () => show(type);
  buttons.appendChild(btn);
});

function show(type) {
  const p = data[type];

  document.getElementById("menu").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("type").textContent = "나의 MBTI: " + type;
  document.getElementById("emoji").textContent = p[1];
  document.getElementById("name").textContent = p[0];
  document.getElementById("reason").textContent = p[2];
  document.getElementById("match").textContent = p[3];

  document.getElementById("matchReason").textContent =
    type + "의 매력과 " + p[3] +
    "의 장점이 만나 서로에게 새로운 즐거움과 도움을 줄 수 있어요!";
}

function back() {
  document.getElementById("result").style.display = "none";
  document.getElementById("menu").style.display = "block";
}
</script>
</body>
</html>
